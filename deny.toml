# cargo-deny configuration for Wormhole OSS modernization

[advisories]
yanked = "warn"
# Only fail unmaintained advisories for direct workspace crates.
unmaintained = "workspace"
ignore = [
    # Wire protocol still uses bincode 1.3; postcard is already the session codec path.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3 is the on-wire format; migration is a protocol bump" },
    # Pulled by tauri/plist and iroh/netdev; no consumer path to quick-xml >= 0.41 yet.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via plist/tauri; awaiting upstream bump" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via plist/tauri; awaiting upstream bump" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    # Common transitive OSS licenses (memchr/aho-corasick, webpki-roots, WinFSP)
    "Unlicense",
    "CDLA-Permissive-2.0",
    "GPL-3.0",
    "GPL-3.0-only",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
